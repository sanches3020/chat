<md-bottom-sheet>
    <form class="col gap32 pb32 pt16" ng-submit="replace()">
        <div class="row asc">
            <div class="flex bold text2">Добавить</div>
            <img class="img-white img30 ripple r16" src="icon/close.svg" ng-click="close()">
        </div>

        <div class="col gap8">
            <input type="text"
                   ng-model="word"
                   required
                   placeholder="Изначальное слово">
            <input type="text"
                   ng-model="fix"
                   required
                   placeholder="Слово для замены">
        </div>
        <button type="submit"
                ng-disabled="in_progress">
            Купить за 50 монет
        </button>
    </form>
</md-bottom-sheet>
