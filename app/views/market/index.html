<div class="flex col">
    <div class="row asc m16">
        <input type="text"
               autocomplete="off"
               oninput="this.value = this.value.toLowerCase().replace(/[^\p{L}0-9_]/gu, '')"
               ng-model="search_text"
               ng-change="reload()"
               placeholder="Поиск слова...">
    </div>
    <div class="flex col scroll-vertical">
        <div class="flex col ph8">
            <div class="row p16 asc ripple gap8 r8 anim"
                 ng-repeat="item in words"
                 ng-click="openChart(item)"
                 ng-style="{'animation-delay': ($index * 0.02) + 's'}">
                <p class="flex">{{item.word}}</p>
                <p class="row aee w80">{{formatPrice(item.price)}}</p>
                <p class="row aee w80" ng-class="percentColor(item.price24)">
                    {{formatPercent(token.price24)}}
                </p>
            </div>
            <div class="col acc text-gray"
                 ng-if="!words.length"
                 style="height: 200px">
                не найдено
            </div>
        </div>
    </div>
</div>
