
<div class="flex col">
  <div class="row asc ph16 pv8 gap16 cursor back-gray200"
       ng-repeat="item in users"
       ng-click="openChat(item)">
    <img class="img40 r100" ng-src="{{item.avatar}}">
    <div class="flex col">
      <div class="row asc">
        <div class="medium flex text-crop text-white">{{item.name}}</div>
        <div class="text-gray500">{{item.time}}</div>
      </div>
      <div class="text-crop text-gray500">{{item.message}}</div>
    </div>
  </div>
</div>
