<div class="col">
  Home<br>
  <button ui-sref="profile">profile</button>
  <button ui-sref="dialog({dialog_id: 123})">dialog(123)</button>
  <button ng-click="openDialog()">openDialog()</button>


  <div class="row fill back-black text-white">

    <div class="col back-gray300 p16 gap16 r16 mw300 mh16 mv0">
      <div class="row acc gap16">
        <img src="/icon/login.svg" class="img30 cursor" ng-click="openLogin()">
        <md-autocomplete
                class="flex text-white"
                md-selected-item="selectedItem"
                md-search-text="searchText"
                md-items="item in getMatches(searchText)"
                md-item-text="item.user_name"
                md-min-length="1"
                md-no-cache="true"
                md-autocomplete-snap="width"
                md-input-name="searchInput"
                placeholder="Поиск">
          <md-item-template>
            <div class="row gap8 p8">
              <div class="img32 r4 back-gray400"></div>
              <div class="col">
                <span class="text-white" md-highlight-text="searchText">{{ item.user_name }}</span>
                <small class="text-gray">{{ item.user_telegram_chat_id }}</small>
              </div>
            </div>
          </md-item-template>
          <md-not-found>
            <div class="text-gray p8">No matches found.</div>
          </md-not-found>
        </md-autocomplete>
      </div>
    </div>

    <div class="col fill mh16 mv0">
      <div class="row acc aec pv8 ph16 back-gray300 r16 w100p">
        <div class="text4 bold">chat_id: {{user_telegram_chat_id}}</div>
      </div>
      <div class="col scroll p16 gap8 flex pb16">

        <div ng-repeat="msg in messages">

          <div class="row" ng-if="msg.message_sender_user_id != user.user_id">
            <div class="back-gray300 text-white pv8 ph12 r16 mw400">
              {{msg.message_text}}
              <span class="text5 text-gray ml8">{{msg.message_timestamp}}
            </span>
            </div>
          </div>
          <div class="row" ng-if="msg.message_sender_user_id == user.user_id">
            <div class="back-purple text-white pv8 ph12 r16 mw400">
              {{msg.message_text}}
              <span class="text5 text-gray ml8">{{msg.message_timestamp}}
            </span>
            </div>
          </div>
        </div>
      </div>

      <form class="row aee gap16 pv8 ph16 back-gray300 r16" ng-submit="new_message()">
        <input type="text"
               placeholder="Сообщение"
               ng-model="message_text"
               autocomplete="off">
        <button type="submit" class="img32 r100 back-purple text-white text-center p0">
          <img src="/icon/mic.svg" class="img20">
        </button>
      </form>
    </div>
  </div>
</div>
