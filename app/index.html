<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Мем чат</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="icon/logo.svg?v=80">

    <link rel="stylesheet" href="utils/css/colors-theme.css">
    <link rel="stylesheet" href="utils/css/colors.css">
    <link rel="stylesheet" href="utils/css/base.css">
    <link rel="stylesheet" href="utils/css/animation.css">
    <link rel="stylesheet" href="node_modules/angular-material/angular-material.min.css">
    <link rel="stylesheet" href="utils/css/style.css">
    <link rel="stylesheet" href="utils/css/shorts.css">

    <script src="node_modules/angular/angular.min.js"></script>
    <script src="node_modules/angular-material/angular-material.min.js"></script>
    <script src="node_modules/angular-animate/angular-animate.min.js"></script>
    <script src="node_modules/angular-aria/angular-aria.min.js"></script>
    <script src="node_modules/angular-messages/angular-messages.min.js"></script>
    <script src="node_modules/@uirouter/angularjs/release/angular-ui-router.min.js"></script>
    <script src="node_modules/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="utils/js/telegram-web-app.js?63"></script>

    <script src="app.js"></script>

    <script src="utils/js/material.js"></script>
    <script src="utils/js/formats.js"></script>
    <script src="utils/js/swipeToRefresh.js"></script>
    <script src="controller.js"></script>
    <script src="views/dialog/controller.js"></script>
    <script src="views/invite/controller.js"></script>
    <script src="views/market/controller.js"></script>
    <script src="views/dialogs/controller.js"></script>
    <script src="views/profile/controller.js"></script>
    <script src="views/chart/controller.js"></script>
    <script src="views/send/controller.js?v=3"></script>
    <script src="views/receive/controller.js?v=2"></script>
    <script src="views/fix/controller.js?v=2"></script>
    <script src="views/analytics/controller.js"></script>
</head>

<body class="col back-black text-white fill" ng-app="app" ng-controller="main">

<div ui-view class="flex col"></div>

<div class="row acc absolute bottom fill-width mb32">
    <div class="row back-gray100 acc r32 gap8 pv8 ph16 anim d05 menu-container" style="position: relative; z-index: 1;">
        <div class="nav-indicator"></div>
        <div class="col acc r32 pv8 ph16 menu-item"
             ng-repeat="(key, val) in menu"
             data-key="{{key}}"
             ng-class="{'is-active': menu_selected == key}"
             ng-click="openPage(key)">
            <img class="img-white img16" src="icon/{{key}}.svg">
            <span>{{val}}</span>
        </div>
    </div>
</div>
</body>
</html>
